name: Social preview metadata

on:
  push:
    paths:
      - '.github/workflows/social-preview-setup.yml'

permissions:
  contents: write

jobs:
  patch-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch social metadata
        run: |
          python -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(); old="<meta property=\"og:type\" content=\"profile\">"; new="""<meta property=\"og:type\" content=\"profile\">\n<link rel=\"canonical\" href=\"https://imcmurry.github.io/\">\n<meta property=\"og:url\" content=\"https://imcmurry.github.io/\">\n<meta property=\"og:image\" content=\"https://imcmurry.github.io/assets/og-preview.jpg\">\n<meta property=\"og:image:type\" content=\"image/jpeg\">\n<meta property=\"og:image:width\" content=\"1200\">\n<meta property=\"og:image:height\" content=\"630\">\n<meta property=\"og:image:alt\" content=\"Ian W. McMurry — Research, Data Science, and Operations\">\n<meta name=\"twitter:card\" content=\"summary_large_image\">\n<meta name=\"twitter:image\" content=\"https://imcmurry.github.io/assets/og-preview.jpg\">"""; assert old in s; s=s.replace(old,new,1); p.write_text(s)'
      - name: Commit metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add LinkedIn Open Graph metadata"
          git push
